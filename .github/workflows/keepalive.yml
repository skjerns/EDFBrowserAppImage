name: Keepalive

# GitHub disables scheduled workflows automatically after 60 days with no
# repository activity. This job pushes a trivial commit once a month so the
# repo never goes quiet for that long, keeping the "Build AppImage" schedule
# (and any other scheduled workflow here) enabled.
on:
  schedule:
    - cron: '0 5 1 * *'   # monthly, 1st at 05:00 UTC (~30 days)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record heartbeat
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive heartbeat" || exit 0
          git push
